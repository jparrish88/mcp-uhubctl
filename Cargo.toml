[package]
name = "mcp-uhubctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Model Context Protocol (MCP) server wrapping uhubctl for per-port USB power control of lab boards (PPK2, J-Link, nRF Sniffer)."
license = "MIT"

[dependencies]
anyhow = "1.0.103"
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
